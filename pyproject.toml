[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "mictools"
dynamic = ["version"]
description = "Support tools for the APS Microscopy Group"
authors = [
    { name = "pdrmrcd" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "h5py",
    "scipy",
    "matplotlib",
    "apstools",
]

[tool.setuptools]
packages = ["mictools"]

[tool.setuptools_scm]
